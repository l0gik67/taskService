services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10
  database-service:
    build:
      context: .
      dockerfile: internal/database-service/Dockerfile
    env_file:
      - ./.env
    ports:
      - "${DATABASE_SERVICE_PORT}:${DATABASE_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/$$DATABASE_SERVICE_PORT'" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  task-service:
    build:
      context: .
      dockerfile: internal/task-service/Dockerfile
    environment:
      DATABASE_SERVICE_ADDRESS: "database-service:${DATABASE_SERVICE_PORT}"
    ports:
      - "${TASK_SERVICE_PORT:-8080}:8080"
    depends_on:
      database-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080'" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      task-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --spider http://127.0.0.1/" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
