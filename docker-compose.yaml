services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d task_service" ]
      interval: 5s
      timeout: 3s
      retries: 10
  database-service:
    build: ./internal/database-service
    env_file:
      - ./.env
    ports:
      - "${DATABASE_SERVICE_PORT}:${DATABASE_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
