syntax = "proto3";

package task.v1;

option go_package = "database-service/api/task/v1;taskv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (google.protobuf.Empty);
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);
  rpc GetTaskById(GetTaskByIdRequest) returns (Task);
  rpc GetTasksByUserId(GetTasksByUserIdRequest) returns (GetTasksByUserIdResponse);
}
message Task {
  int64 id = 1;
  string title = 2;
  int64 user_id = 3;
  int32 duration_seconds = 4;
  google.protobuf.Timestamp start_time = 5;
  int32 priority = 6;
  string description = 7;
  int64 column_id = 8;
  int32 position = 9;
  int32 progress = 10;
  bool is_done = 11;
  google.protobuf.Timestamp completed_at = 12;
}

message CreateTaskRequest {
  string title = 1;
  int64 user_id = 2;
  int32 duration_seconds = 3;
  google.protobuf.Timestamp start_time = 4;
  int32 priority = 5;
  string description = 6;
  int64 column_id = 7;
  int32 position = 8;
  int32 progress = 9;
  bool is_done = 10;
}

message CreateTaskResponse {
  Task task = 1;
}

message UpdateTaskRequest {
  int64 id = 1;
  string title = 2;
  int64 user_id = 3;
  int32 duration = 4;
  google.protobuf.Timestamp start_time = 5;
  int32 priority = 6;
  string description = 7;
  int64 column_id = 8;
  int32 position = 9;
  int32 progress = 10;
  bool is_done = 11;
}

message DeleteTaskRequest {
  int64 id = 1;
}

message GetTaskByIdRequest {
  int64 id = 1;
}

message GetTasksByUserIdRequest {
  int64 user_id = 1;
  int64 board_id = 2;
}

message GetTasksByUserIdResponse {
  repeated Task tasks = 1;
}
